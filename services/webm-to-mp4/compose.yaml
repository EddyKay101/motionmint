services:
  converter:
    build: .
    ports:
      - "8080:8080"
    environment:
      CORS_ORIGIN: http://localhost:3000
      MAX_UPLOAD_MB: 250
      MAX_CONCURRENT_CONVERSIONS: 2
      CONVERSION_TIMEOUT_SECONDS: 300
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
